<body>
    <style>
        body {

    <div>
        <h1>Open the console to start a game</h1>
        <p>Click Ctrl+SHIFT+J to open the console</p>
    </div>
    <script>

        
// Rock paper scissors solution description
//   The user will play against the computer in the Browser console. The user will be able to choose from rock, paper and cissors. The computer then chooses randomly from R/P/C. A comparison is made, then the winner is announced. If it is a draw, announce it
// The rules for the comparison are: 
// P > R 
// R > C
// C > P
// We cannot assign each (p/r/c) a number and compare with <> because each one is vulnerable against at least one of the choices and advantaged against another. Let me think of making all the scores into boolean operations
// create combs where comb checks the combination and returns true/false
// what are combs anyway? a boolean variable. What does it compare? 


// comb 2 = choice == "paper" && randChoice =="cissors"
// comb 3 = choice == "paper" && randChoice =="rock" // in this combinations the user loses 


// comb 5 = choice == "rock" && randChoice =="cissors"
// comb 6 = choice == "rock" && randChoice =="paper"


// comb 8 = choice == "cissors" && randChoice =="paper"
// comb 9 = choice == "cissors" && randChoice =="rock" 

// Let's only check for winning combinations:

// comb 2 = choice == "paper" && randChoice =="cissors" 
// comb 5 = choice == "rock" && randChoice =="cissors".
// comb 8 = choice == "cissors" && randChoice =="paper"

// this way we can write if (comb2 OR comb5 OR comb8) and if either returns true, the player won. if the computer and the user make the same choice, it's a draw. In all the remaining cases, the computer wins.

// Ask the user to choose from R/P/C
// Store user choice in var choice
// Randomly select from R/P/C
// Store the randomly selected in var randChoice
// Compare choice with randChoice
//   if choice equals randChoice, it's a draw
//   if any of the winning combinations is true, player wins and game ends
//   In all the remaining cases, the computer wins.

// getComputerChoice:
// choice = ["rock", "paper", "scissors"]
// i = random(3)
// return choice[i]

        function random(n) {
            n = Number(n);
            n = Math.floor(Math.random()*n);
            return n;
        }

        // The Odin Project actually says not to use arrays, so we use switch instead 
        function getComputerChoice() {
            let choice = random(3);
            switch(choice) {
                case 0:
                    return "rock";
                case 1:
                    return "paper";
                case 2:
                    return "scissors"
            }
        }
        
        // The handling would be better done with 
        // checking for hChoice in an array with .includes()
        // In this example I decided to only use concepts and
        // constructs covered so far in The Odin Project   
        function getHumanChoice() {
            let hChoice = "";
            hChoice = prompt("Choose rock, paper or scissors");
            hChoice ? hChoice = () => {
                hChoice = hChoice.toLowerCase()
                switch(hChoice){   
                    case "rock": 
                        console.log("Player chose rock");         
                        return "rock";
                    case "paper":
                        console.log("Player chose paper");
                        return "paper";
                    case "scissors":
                        console.log("Player chose scissors");
                        return "scissors";
                }

            } : alert("Invalid choice");
                console.log("Invalid choice.");  
        }

        let humanScore, computerScore = 0;

        function playRound (humanChoice, computerChoice) {
            humanChoice = getHumanChoice();
            computerChoice = getComputerChoice();
            // A win table would be preferable in this case for scalability,
            // but for the scope of this assignment this will do.
            let comb1 = humanChoice == "paper" && computerChoice =="rock";
            let comb2 = humanChoice == "rock" && computerChoice =="cissors";
            let comb3 = humanChoice == "cissors" && computerChoice =="paper";
            if (humanChoice == computerChoice) {
                console.log("it's a draw!")
            } else if (com1 || comb2 || comb3) {
                console.log("Player wins!")
                ++humanScore;
            } else {
                
            }
        }


    </script>
